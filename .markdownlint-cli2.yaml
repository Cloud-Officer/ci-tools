globs:
  - "**/*.md"
  - "!.*"
  # Same exclusion set github-build generates into the ghb:excluded-dirs blocks of
  # trivy.yaml and .semgrepignore, and that find_lintable applies in `linters`.
  - "!**/.build/**"
  - "!**/.bundle/**"
  - "!**/.git/**"
  - "!**/.gradle/**"
  - "!**/.hg/**"
  - "!**/.m2/**"
  - "!**/.npm/**"
  - "!**/.pnpm/**"
  - "!**/.pytest_cache/**"
  - "!**/.svn/**"
  - "!**/.venv/**"
  - "!**/.yarn/**"
  - "!**/__pycache__/**"
  - "!**/build/**"
  - "!**/Carthage/**"
  - "!**/coverage/**"
  - "!**/DerivedData/**"
  - "!**/dist/**"
  - "!**/env/**"
  - "!**/Libraries/**"
  - "!**/node_modules/**"
  - "!**/Pods/**"
  - "!**/target/**"
  - "!**/vendor/**"
  - "!**/venv/**"
  # Claude Code skill review artifacts: rewritten wholesale on every run and gitignored,
  # so a lint failure there can only be "fixed" by regenerating the file. Living docs the
  # same skills maintain (README.md, docs/architecture.md, docs/user-guide.md, docs/db.md,
  # docs/ownership-map.md, docs/threat-model.md) stay linted.
  - "!docs/code-review.md"
  - "!docs/copy-review.md"
  - "!docs/migration/**"
  - "!docs/prompt-review.md"
  - "!docs/seo-audit.md"
config:
  default: true
  first-line-heading: false
  line-length: false
  no-duplicate-heading: false
  single-h1: false
  tables: false
  no-inline-html:
    allowed_elements:
      - br
